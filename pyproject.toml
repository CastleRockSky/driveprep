[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driveprep"
version = "1.0.0"
description = "Securely erase, health-test, and document used hard disk drives for resale"
requires-python = ">=3.12"
# No runtime dependencies. Spec section 2 commits to the standard library only;
# grading config is TOML so tomllib covers it.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
driveprep = "driveprep.__main__:main"

[tool.setuptools]
packages = ["driveprep"]

[tool.setuptools.package-data]
driveprep = ["templates/*.html", "templates/*.css", "config/*.toml"]

[tool.pytest.ini_options]
markers = [
    "root: test requires root (losetup, device-mapper, mount)",
]
testpaths = ["tests"]
